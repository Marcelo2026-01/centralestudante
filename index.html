<!DOCTYPE html>

    <!-- Configuração do Tailwind (Temas Preto e Laranja) -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#fff7ed',  // Laranja super claro
                            100: '#ffedd5', // Laranja claro
                            200: '#fed7aa',
                            500: '#f97316', // Laranja principal
                            600: '#ea580c', // Laranja hover
                            700: '#c2410c', // Laranja texto escuro
                            900: '#7c2d12', // Laranja ultra escuro
                        },
                        dark: {
                            bg: '#000000',     // Preto puro
                            card: '#121212',   // Cinza muito escuro (para destacar os cards do fundo preto)
                            border: '#27272a'  // Borda cinza chumbo
                        }
                    }
                }
            }
        }
    </script>

    <!-- Estilos Customizados -->
    <style>
        /* Tipografia mais nítida */
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #3f3f46; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animações e Transições */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Estilos do Toast */
        #toast-container {
            position: fixed; top: 20px; right: 20px; z-index: 9999;
            display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            background-color: #18181b; color: white;
            padding: 12px 20px; border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            display: flex; align-items: center; gap: 10px;
            font-size: 0.875rem; font-weight: 500;
            animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards, fadeOut 0.3s ease-in forwards 3s;
            border-left: 4px solid #ea580c; /* Laranja da borda */
        }
        .dark .toast { background-color: #27272a; }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(-10px); }
        }

        /* Checkbox Customizado */
        .task-checkbox:checked + div {
            background-color: #22c55e;
            border-color: #22c55e;
        }
        .task-checkbox:checked + div i { opacity: 1; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-dark-bg text-gray-800 dark:text-gray-200 font-sans h-screen flex overflow-hidden transition-colors duration-200 selection:bg-primary-100 selection:text-primary-900 dark:selection:bg-primary-900 dark:selection:text-primary-100">

    <script>
        // --- 1. GERENCIAMENTO DE ESTADO E DADOS ---
        
        // Dados de demonstração (Persona: José Marcelo, Iniciante)
        const today = new Date();
        const d_today = today.toISOString().split('T')[0];
        const d_tomorrow = new Date(today.getTime() + 86400000).toISOString().split('T')[0];
        const d_in3days = new Date(today.getTime() + 3 * 86400000).toISOString().split('T')[0];
        const d_yesterday = new Date(today.getTime() - 86400000).toISOString().split('T')[0];

        const DEFAULT_DATA = {
            user: { 
                name: 'José Marcelo', 
                course: 'Licenciatura em Informática', 
                semester: '1º Semestre',
                theme: 'dark' // O tema padrão agora é dark para impressionar logo de cara!
            },
            subjects: [
                { id: 's1', name: 'Introdução à Informática', prof: 'Prof. João', color: 'orange' },
                { id: 's2', name: 'Metodologia Científica', prof: 'Dra. Ana', color: 'gray' },
                { id: 's3', name: 'Fundamentos da Educação', prof: 'Prof. Carlos', color: 'orange' }
            ],
            tasks: [
                { id: 't1', title: 'Fórum de Apresentação', subjectId: 's1', date: d_today, priority: 'urgent', status: 'pending' },
                { id: 't2', title: 'Resumo do Capítulo 1', subjectId: 's2', date: d_tomorrow, priority: 'high', status: 'pending' },
                { id: 't3', title: 'Prova Online Unidade I', subjectId: 's3', date: d_in3days, priority: 'urgent', status: 'pending' },
                { id: 't4', title: 'Leitura Complementar', subjectId: 's1', date: d_today, priority: 'low', status: 'completed' },
                { id: 't5', title: 'Atividade Prática HTML', subjectId: 's1', date: d_yesterday, priority: 'high', status: 'pending' } // Atrasada
            ],
            links: [
                { id: 'l1', title: 'AVA (Ambiente Virtual)', url: '#', category: 'Sistemas', icon: 'ph-graduation-cap', color: 'bg-primary-100 text-primary-600 dark:bg-primary-900/30 dark:text-primary-500' },
                { id: 'l2', title: 'Portal do Aluno', url: '#', category: 'Sistemas', icon: 'ph-identification-card', color: 'bg-gray-200 text-gray-700 dark:bg-gray-800 dark:text-gray-300' },
                { id: 'l3', title: 'Google Drive da Turma', url: '#', category: 'Materiais', icon: 'ph-google-logo', color: 'bg-primary-50 text-primary-500 dark:bg-[#1a1a1a] dark:text-primary-600' },
                { id: 'l4', title: 'Biblioteca Virtual', url: '#', category: 'Pesquisa', icon: 'ph-books', color: 'bg-gray-100 text-gray-600 dark:bg-[#1a1a1a] dark:text-gray-400' }
            ]
        };

        let state = {};
        let currentView = 'dashboard';
        let currentAddType = 'task';
        let editingId = null;

        // --- 2. INICIALIZAÇÃO E PERSISTÊNCIA ---
        function initApp() {
            const saved = localStorage.getItem('centralEstudanteData_V2'); // Nova chave para não conflitar com a versão antiga
            if (saved) {
                try {
                    state = JSON.parse(saved);
                    if(!state.links) state.links = DEFAULT_DATA.links;
                } catch(e) {
                    console.error("Erro ao ler dados, restaurando padrões.");
                    state = JSON.parse(JSON.stringify(DEFAULT_DATA));
                }
            } else {
                state = JSON.parse(JSON.stringify(DEFAULT_DATA));
            }

            applyTheme();
            updateUIProfile();
            navigate('dashboard');
        }

        function saveState() {
            localStorage.setItem('centralEstudanteData_V2', JSON.stringify(state));
            updateUIProfile();
        }

        // --- 3. UTILITÁRIOS ---
        const Util = {
            generateId: () => Math.random().toString(36).substr(2, 9),
            
            formatDate: (dateStr) => {
                if(!dateStr) return '';
                const [y, m, d] = dateStr.split('-');
                return `${d}/${m}`;
            },
            
            getRelativeDateLabel: (dateStr) => {
                if(!dateStr) return '';
                const t = new Date(dateStr + 'T00:00:00');
                const now = new Date();
                now.setHours(0,0,0,0);
                
                const diffTime = t - now;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                if (diffDays === 0) return 'Hoje';
                if (diffDays === 1) return 'Amanhã';
                if (diffDays === -1) return 'Ontem';
                if (diffDays > 1 && diffDays < 7) return `Em ${diffDays} dias`;
                if (diffDays < 0) return `Atrasado há ${Math.abs(diffDays)} dias`;
                return Util.formatDate(dateStr);
            },

            isOverdue: (dateStr) => {
                if(!dateStr) return false;
                const today = new Date();
                today.setHours(0,0,0,0);
                const taskDate = new Date(dateStr + 'T00:00:00');
                return taskDate < today;
            },

            getSubjectInfo: (id) => {
                return state.subjects.find(s => s.id === id) || { name: 'Sem disciplina', color: 'gray' };
            },

            getColorClasses: (colorName) => {
                // Adaptado para Preto e Laranja
                const colors = {
                    orange: { bg: 'bg-primary-100 dark:bg-primary-900/20', text: 'text-primary-700 dark:text-primary-500', border: 'border-primary-200 dark:border-primary-800' },
                    gray: { bg: 'bg-gray-100 dark:bg-gray-800', text: 'text-gray-700 dark:text-gray-300', border: 'border-gray-200 dark:border-gray-700' },
                    // Fallbacks caso tenham cores antigas salvas
                    blue: { bg: 'bg-primary-100 dark:bg-primary-900/20', text: 'text-primary-700 dark:text-primary-500', border: 'border-primary-200 dark:border-primary-800' },
                    purple: { bg: 'bg-gray-100 dark:bg-gray-800', text: 'text-gray-700 dark:text-gray-300', border: 'border-gray-200 dark:border-gray-700' },
                    green: { bg: 'bg-green-100 dark:bg-green-900/20', text: 'text-green-700 dark:text-green-400', border: 'border-green-200 dark:border-green-800' },
                    red: { bg: 'bg-red-100 dark:bg-red-900/20', text: 'text-red-700 dark:text-red-400', border: 'border-red-200 dark:border-red-800' },
                };
                return colors[colorName] || colors['gray'];
            },

            showToast: (message, type = 'success') => {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = 'toast';
                const icon = type === 'success' ? '<i class="ph-fill ph-check-circle text-primary-500 text-xl"></i>' : '<i class="ph-fill ph-info text-primary-500 text-xl"></i>';
                toast.innerHTML = `${icon} <span>${message}</span>`;
                container.appendChild(toast);
                setTimeout(() => { if(toast.parentNode) toast.remove(); }, 3300);
            }
        };

        // --- 4. TEMA E UI GERAL ---
        function toggleTheme() {
            state.user.theme = state.user.theme === 'dark' ? 'light' : 'dark';
            saveState();
            applyTheme();
        }

        function applyTheme() {
            if (state.user.theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function updateUIProfile() {
            document.getElementById('ui-user-name').innerText = state.user.name;

        function navigate(view) {
            currentView = view;
            
            document.querySelectorAll('.nav-item, .mobile-nav-item').forEach(el => {
                el.classList.remove('active', 'text-primary-700', 'dark:text-primary-400', 'bg-primary-50', 'dark:bg-primary-900/20', 'text-primary-600', 'dark:text-white');
                
                if(el.classList.contains('nav-item')) {
                    el.classList.add('text-gray-600', 'dark:text-gray-400');
                    el.querySelector('i').classList.remove('text-primary-600', 'dark:text-primary-500');
                    el.querySelector('i').classList.add('text-gray-400', 'dark:text-gray-500');
                } else {
                    el.classList.add('text-gray-400', 'dark:text-gray-500');
                }
            });

            const activeItems = document.querySelectorAll(`[data-view="${view}"]`);
            activeItems.forEach(el => {
                if(el.classList.contains('nav-item')) {
                    el.classList.add('active', 'text-primary-700', 'dark:text-white', 'bg-primary-50', 'dark:bg-primary-900/10');
                    el.classList.remove('text-gray-600', 'dark:text-gray-400');
                    el.querySelector('i').classList.add('text-primary-600', 'dark:text-primary-500');
                    el.querySelector('i').classList.remove('text-gray-400', 'dark:text-gray-500');
                } else {
                    el.classList.add('active', 'text-primary-600', 'dark:text-primary-500');
                    el.classList.remove('text-gray-400', 'dark:text-gray-500');
                }
            });

            const titles = {
                'dashboard': 'Visão Geral', 'subjects': 'Minhas Disciplinas', 'tasks': 'Central de Tarefas',
                'links': 'Sistemas e Links', 'settings': 'Configurações'
            };
            document.getElementById('header-title').innerText = titles[view] || '';

            const content = document.getElementById('app-content');
            content.classList.remove('fade-in');
            void content.offsetWidth;
            content.classList.add('fade-in');

            switch(view) {
                case 'dashboard': renderDashboard(); break;
                case 'subjects': renderSubjects(); break;
                case 'tasks': renderTasks(); break;
                case 'links': renderLinks(); break;
                case 'settings': renderSettings(); break;
            }
        }

        function renderTasks() {

        function renderTaskRow(task, isCompleted = false) {
            const sub = Util.getSubjectInfo(task.subjectId);
            const isLate = !isCompleted && Util.isOverdue(task.date);
            const dateLabel = Util.getRelativeDateLabel(task.date);
            
            let prioIcon = '';
            let dateColor = 'text-gray-500 dark:text-gray-400';
            let bgClass = 'bg-white dark:bg-dark-card border-gray-100 dark:border-dark-border';

            if (!isCompleted) {
                if(task.priority === 'urgent') prioIcon = '<i class="ph-fill ph-warning text-red-500" title="Urgente"></i>';
                else if(task.priority === 'high') prioIcon = '<i class="ph-fill ph-arrow-up text-primary-500" title="Alta prioridade"></i>';

                if (isLate) {
                    dateColor = 'text-red-600 dark:text-red-400 font-semibold';
                    bgClass = 'bg-red-50/50 dark:bg-red-900/10 border-red-100 dark:border-red-900/30';
                } else if (dateLabel === 'Hoje') {
                    dateColor = 'text-primary-600 dark:text-primary-400 font-semibold';
                }

            return `
                <div class="rounded-xl p-3 sm:p-4 border shadow-sm hover:shadow-md transition-shadow group flex items-start gap-3 sm:gap-4 ${bgClass} relative overflow-hidden">
                    ${isLate && !isCompleted ? '<div class="absolute left-0 top-0 bottom-0 w-1 bg-red-500"></div>' : ''}
                    
                    <label class="mt-0.5 cursor-pointer flex-shrink-0 relative">
                        <input type="checkbox" class="task-checkbox sr-only" ${isCompleted ? 'checked' : ''} onchange="toggleTask('${task.id}')">

                        <div class="flex items-start justify-between gap-2 mb-1">
                            <h4 class="font-semibold text-gray-900 dark:text-gray-100 text-sm sm:text-base leading-tight ${isCompleted ? 'line-through text-gray-500 dark:text-gray-500' : ''}">${task.title}</h4>
                            <div class="flex items-center gap-1.5 shrink-0 mt-0.5">
                                ${prioIcon}
                                <span class="text-[10px] sm:text-xs ${dateColor} whitespace-nowrap bg-gray-50 dark:bg-black border border-transparent dark:border-dark-border px-1.5 py-0.5 rounded">${dateLabel}</span>
                            </div>
                        </div>
                        <p class="text-xs text-gray-500 dark:text-gray-400 truncate flex items-center gap-1">
                            <span class="w-2 h-2 rounded-full ${Util.getColorClasses(sub.color).bg.split(' ')[0].replace('100', '500')}"></span>
                            ${sub.name}

                    <div class="opacity-0 group-hover:opacity-100 transition-opacity flex flex-col sm:flex-row gap-1 mt-0.5 shrink-0">

                        <button class="text-gray-400 dark:text-gray-600 hover:text-primary-500 p-1 transition-colors" onclick="openModalEditTask('${task.id}')" title="Editar">
                            <i class="ph-bold ph-pencil-simple"></i>
                        </button>
                        ` : ''}
                        <button class="text-gray-400 dark:text-gray-600 hover:text-red-500 p-1 transition-colors" onclick="deleteTask('${task.id}')" title="Excluir">
                            <i class="ph-bold ph-trash"></i>
                        </button>
                    </div>
                </div>
            `;
        }

                        <div class="p-6 bg-gray-50 dark:bg-[#0a0a0a]">
                            <h3 class="font-bold text-lg text-gray-800 dark:text-gray-200 mb-2">Sobre a Central do Estudante</h3>
                            <p class="text-sm text-gray-600 dark:text-gray-400 leading-relaxed mb-4">
                                Criado para estudantes que querem ter controle sobre sua vida acadêmica.
                                <strong class="text-primary-600 dark:text-primary-500">Seu AVA continua sendo o AVA. A Central organiza o resto.</strong>
                            </p>
                            
                            <!-- Nova seção de autoria -->
                            <div class="flex items-center gap-3 mt-5 pt-5 border-t border-gray-200 dark:border-[#222]">
                                <div class="w-10 h-10 rounded-full bg-gray-200 dark:bg-black border border-gray-300 dark:border-[#333] flex items-center justify-center text-gray-500 dark:text-gray-400">
                                    <i class="ph-fill ph-code text-lg"></i>
                                </div>
                                <div>
                                    <p class="text-[10px] uppercase tracking-wider font-bold text-gray-400 dark:text-gray-500 mb-0.5">Idealizado e Desenvolvido por</p>
                                    <p class="text-sm font-semibold text-gray-900 dark:text-gray-100">José Marcelo dos Santos</p>
                                </div>
                            </div>

                            <p class="text-xs text-gray-500 flex items-center gap-1.5 mt-5"><i class="ph-fill ph-shield-check text-green-500"></i> Seus dados estão armazenados localmente neste dispositivo.</p>
                        </div>
                    </div>
                    
                    <button onclick="resetData()" class="text-red-500 hover:text-red-700 text-sm font-medium flex items-center gap-2">
                        <i class="ph-bold ph-warning-circle"></i> Restaurar dados originais (Apagar tudo)
                    </button>
                </div>
            `;
        }

        // --- 6. LÓGICA DE AÇÕES ---
        function toggleTask(id) {
            const task = state.tasks.find(t => t.id === id);
            if (task) {
                task.status = task.status === 'completed' ? 'pending' : 'completed';
                saveState();
                Util.showToast(task.status === 'completed' ? 'Atividade concluída!' : 'Movida para pendentes.');
                if(currentView === 'tasks') renderTasks();
                else if(currentView === 'dashboard') renderDashboard();
            }
        }

        function deleteTask(id) {
            if(confirm("Excluir esta tarefa?")) {
                state.tasks = state.tasks.filter(t => t.id !== id);
                saveState();
                if(currentView === 'tasks') renderTasks();
                else renderDashboard();
            }
        }

        function clearCompletedTasks() {
            if(confirm("Deseja limpar permanentemente todas as tarefas concluídas?")) {
                state.tasks = state.tasks.filter(t => t.status !== 'completed');
                saveState();
                if(currentView === 'tasks') renderTasks();
                else renderDashboard();
                Util.showToast("Tarefas finalizadas foram limpas.");
            }
        }

        function deleteSubject(id) {
            if(confirm("Excluir disciplina e todas as tarefas associadas?")) {
                state.subjects = state.subjects.filter(s => s.id !== id);
                state.tasks = state.tasks.filter(t => t.subjectId !== id);
                saveState();
                renderSubjects();
            }
        }

        function saveProfile() {
            state.user.name = document.getElementById('set-name').value || 'Estudante';
            state.user.course = document.getElementById('set-course').value || 'Curso';
            saveState();
            Util.showToast('Perfil atualizado com sucesso!');
        }

        function resetData() {
            if(confirm("Tem certeza? Isso apagará todos os seus dados e voltará ao modelo inicial.")) {
                localStorage.removeItem('centralEstudanteData_V2');
                location.reload();
            }
        }

        // --- 7. GERENCIAMENTO DE MODAL ---
        function openModalAdd(type = 'task') {
            editingId = null;
            document.getElementById('modal-title').innerText = "Novo Registro";
            const modal = document.getElementById('modal-add');
            modal.classList.remove('hidden');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            modal.querySelector('#modal-add-content').classList.remove('scale-95');
            setAddType(type);
        }

        function openModalEditTask(id) {
            const task = state.tasks.find(t => t.id === id);
            if(!task) return;
            editingId = id;
            const modal = document.getElementById('modal-add');
            modal.classList.remove('hidden');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            modal.querySelector('#modal-add-content').classList.remove('scale-95');
            
            document.getElementById('modal-title').innerText = "Editar Tarefa";
            setAddType('task');
            
            setTimeout(() => {
                document.getElementById('add-title').value = task.title;
                document.getElementById('add-subject').value = task.subjectId;
                document.getElementById('add-date').value = task.date;
                document.getElementById('add-priority').value = task.priority;
            }, 10);
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            modal.classList.add('opacity-0');
            modal.children[0].classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function setAddType(type) {
            currentAddType = type;
            const tabs = ['task', 'subject', 'link'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-add-${t}`);
                if (t === type) {
                    btn.className = "flex-1 py-1.5 text-sm font-bold rounded-md bg-white dark:bg-[#1a1a1a] shadow-sm text-primary-600 dark:text-primary-500 transition-all border border-gray-200 dark:border-dark-border";
                } else {
                    btn.className = "flex-1 py-1.5 text-sm font-medium rounded-md text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 transition-all border border-transparent";
                }
            });

            const form = document.getElementById('form-add');
            const inputClass = "w-full bg-gray-50 dark:bg-black border border-gray-200 dark:border-dark-border rounded-xl px-4 py-2.5 text-sm text-gray-900 dark:text-white outline-none focus:border-primary-500 focus:ring-1 focus:ring-primary-500 transition-shadow";
            const labelClass = "block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1.5 uppercase tracking-wide";

            if (type === 'task') {
                const subjOptions = state.subjects.length > 0 
                    ? state.subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('')
                    : `<option value="" disabled selected>Cadastre uma disciplina</option>`;

                form.innerHTML = `
                    <div>
                        <label class="${labelClass}">O que precisa fazer?</label>
                        <input type="text" id="add-title" required class="${inputClass}" placeholder="Ex: Prova de Matemática..." autofocus>
                    </div>
                    <div>
                        <label class="${labelClass}">Disciplina</label>
                        <select id="add-subject" class="${inputClass}" ${state.subjects.length===0?'disabled':''}>${subjOptions}</select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="${labelClass}">Prazo / Data</label>
                            <input type="date" id="add-date" required class="${inputClass}">
                        </div>
                        <div>
                            <label class="${labelClass}">Prioridade</label>
                            <select id="add-priority" class="${inputClass}">
                                <option value="low">Tranquila</option>
                                <option value="medium" selected>Normal</option>
                                <option value="high">Alta</option>
                                <option value="urgent">Urgente 🔥</option>
                            </select>
                        </div>
                    </div>
                `;
            } else if (type === 'subject') {
                form.innerHTML = `
                    <div>
                        <label class="${labelClass}">Nome da Disciplina</label>
                        <input type="text" id="add-title" required class="${inputClass}" placeholder="Ex: Cálculo I">
                    </div>
                    <div>
                        <label class="${labelClass}">Professor (Opcional)</label>
                        <input type="text" id="add-prof" class="${inputClass}" placeholder="Nome do docente">
                    </div>
                    <div>
                        <label class="${labelClass}">Cor (Marcador)</label>
                        <select id="add-color" class="${inputClass}">
                            <option value="orange">Laranja</option>
                            <option value="gray">Cinza / Neutro</option>
                        </select>
                    </div>
                `;
            } else if (type === 'link') {
                form.innerHTML = `
                    <div>
                        <label class="${labelClass}">Nome do Sistema</label>
                        <input type="text" id="add-title" required class="${inputClass}" placeholder="Ex: Portal do Aluno">
                    </div>
                    <div>
                        <label class="${labelClass}">Link (URL)</label>
                        <input type="url" id="add-url" required class="${inputClass}" placeholder="https://..." value="https://">
                    </div>
                    <div>
                        <label class="${labelClass}">Categoria</label>
                        <select id="add-category" class="${inputClass}">
                            <option value="Sistemas">Sistemas Oficiais</option>
                            <option value="Materiais">Drive / Pastas</option>
                            <option value="Pesquisa">Biliotecas</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                `;
            }
        }

        function submitForm() {
            const titleInput = document.getElementById('add-title');
            if(titleInput) titleInput.classList.remove('border-red-500', 'ring-1', 'ring-red-500');

            if(!titleInput || !titleInput.value.trim()) {
                Util.showToast("O título é obrigatório.", "info");
                if(titleInput) {
                    titleInput.classList.add('border-red-500', 'ring-1', 'ring-red-500');
                    titleInput.focus();
                }
                return;
            }

            if (currentAddType === 'task') {
                if(state.subjects.length === 0) {
                    Util.showToast("Crie uma disciplina primeiro.", "info");
                    return;
                }
                const dateVal = document.getElementById('add-date').value || new Date().toISOString().split('T')[0];
                
                if (editingId) {
                    const taskIndex = state.tasks.findIndex(t => t.id === editingId);
                    if(taskIndex !== -1) {
                        state.tasks[taskIndex] = {
                            ...state.tasks[taskIndex],
                            title: titleInput.value,
                            subjectId: document.getElementById('add-subject').value,
                            date: dateVal,
                            priority: document.getElementById('add-priority').value
                        };
                        Util.showToast("Tarefa atualizada!");
                    }
                } else {
                    state.tasks.push({
                        id: Util.generateId(),
                        title: titleInput.value,
                        subjectId: document.getElementById('add-subject').value,
                        date: dateVal,
                        priority: document.getElementById('add-priority').value,
                        status: 'pending'
                    });
                    Util.showToast("Tarefa cadastrada!");
                }
            } 
            else if (currentAddType === 'subject') {
                state.subjects.push({
                    id: Util.generateId(),
                    name: titleInput.value,
                    prof: document.getElementById('add-prof').value,
                    color: document.getElementById('add-color').value
                });
                Util.showToast("Disciplina cadastrada!");
            }
            else if (currentAddType === 'link') {
                const colorMap = {
                    'Sistemas': 'bg-primary-100 text-primary-600 dark:bg-primary-900/30 dark:text-primary-500',
                    'Materiais': 'bg-gray-100 text-gray-700 dark:bg-[#1a1a1a] dark:text-gray-300',
                    'Pesquisa': 'bg-primary-50 text-primary-500 dark:bg-[#1a1a1a] dark:text-primary-600',
                    'Outros': 'bg-gray-50 text-gray-600 dark:bg-black dark:text-gray-400'
                };
                const iconMap = {
                    'Sistemas': 'ph-laptop', 'Materiais': 'ph-folder', 'Pesquisa': 'ph-magnifying-glass', 'Outros': 'ph-link'
                };
                const cat = document.getElementById('add-category').value;
                
                state.links.push({
                    id: Util.generateId(),
                    title: titleInput.value,
                    url: document.getElementById('add-url').value,
                    category: cat,
                    icon: iconMap[cat],
                    color: colorMap[cat]
                });
                Util.showToast("Link salvo!");
            }

            saveState();
            closeModal('modal-add');
            
            if (currentView === 'dashboard') renderDashboard();
            else if (currentView === 'subjects' && currentAddType === 'subject') renderSubjects();
            else if (currentView === 'tasks' && currentAddType === 'task') renderTasks();
            else if (currentView === 'links' && currentAddType === 'link') renderLinks();
        }

        window.onload = initApp;
    </script>
</body>
</html>
